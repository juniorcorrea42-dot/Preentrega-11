{% extends 'posts/base.html' %}

{% block title %}Iniciar sesión | Blog de Energías Renovables{% endblock %}

{% block content %}
    <section>
        <h2>Iniciar sesión</h2>

        {% if form.errors %}
            <p style="color: #e74c3c;">Usuario o contraseña incorrectos. Intentá nuevamente.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="background-color: #2c3e50; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                Ingresar
            </button>
        </form>
    </section>
{% endblock %}
