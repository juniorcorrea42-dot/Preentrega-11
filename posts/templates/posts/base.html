{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog de Energías Renovables{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}">
</head>
<body>
    <header class="header">
        <h1>Renovables Italia Blog</h1>
        <nav class="navbar">
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'lista_posts' %}">Publicaciones</a>
            <a href="{% url 'crear_post' %}">Nuevo Post</a>
            <a href="{% url 'acerca' %}">Acerca de</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>© 2026 Junior Correa - Posgrado en Energías Renovables</p>
    </footer>
</body>
</html>
